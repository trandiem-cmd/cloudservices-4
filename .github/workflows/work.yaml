name: Build and Deploy Webpage to Rahti

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/webpage:${{ github.sha}}" >> $GITHUB_ENV

      - name: Build container image
        run: docker build -t "${IMAGE}" -f frontend/Dockerfile .
      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Push image
        run: docker push "${IMAGE}"

      - name: Install oc CLI
        run: |
          curl -sLO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz oc
          sudo mv oc /usr/local/bin/

      - name: Deploy to Rahti
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|" webpage-deployment.yaml
          oc login --token=${{ secrets.RAHTI_TOKEN }} --server=${{ secrets.RAHTI_SERVER }}
          oc apply -f webpage-deployment.yaml
